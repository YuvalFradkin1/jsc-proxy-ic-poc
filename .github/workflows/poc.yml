name: JSC Proxy Handler IC Stale Pointer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  poc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find jsc and check provenance
        run: |
          echo "=== PLATFORM ==="
          uname -m
          sw_vers
          echo ""
          echo "=== SEARCHING JSC (targeted) ==="
          # Search only specific known locations — no find /
          for PATH_TRY in \
            "/System/Library/Frameworks/JavaScriptCore.framework/Versions/A/Helpers/jsc" \
            "/System/Library/Frameworks/JavaScriptCore.framework/Helpers/jsc" \
            "/usr/bin/jsc" \
            "/usr/local/bin/jsc"; do
            if [ -f "$PATH_TRY" ]; then
              echo "Found: $PATH_TRY"
              JSC="$PATH_TRY"
              break
            fi
          done
          # Xcode fallback — limited depth
          if [ -z "$JSC" ]; then
            JSC=$(find /Applications/Xcode.app/Contents/SharedFrameworks \
                       -maxdepth 5 -name "jsc" -type f 2>/dev/null | \
                       grep -v iOSSupport | head -1)
          fi
          echo "SELECTED: $JSC"
          echo "JSC=$JSC" >> $GITHUB_ENV
          echo ""
          echo "=== PROVENANCE ==="
          file "$JSC"
          codesign -dv "$JSC" 2>&1
          otool -L "$JSC" | grep -i "JavaScriptCore"

      - name: Control A (expect exit 0)
        run: |
          set +e; "$JSC" pocs/control_a.js 2>&1; EXIT=$?
          echo "exit_a=$EXIT" >> $GITHUB_ENV
          echo "Control A exit: $EXIT"

      - name: Control B (expect exit 0)
        run: |
          set +e; "$JSC" pocs/control_b.js 2>&1; EXIT=$?
          echo "exit_b=$EXIT" >> $GITHUB_ENV
          echo "Control B exit: $EXIT"

      - name: Control C (expect exit 0)
        run: |
          set +e; "$JSC" pocs/control_c.js 2>&1; EXIT=$?
          echo "exit_c=$EXIT" >> $GITHUB_ENV
          echo "Control C exit: $EXIT"

      - name: PoC D - FULL TRIGGER (expect SIGSEGV exit 139)
        run: |
          echo "=== POC D ==="
          set +e
          "$JSC" pocs/poc_d.js 2>&1
          EXIT=$?
          set -e
          echo "exit_d=$EXIT" >> $GITHUB_ENV
          if [ $EXIT -eq 139 ]; then
            echo "*** SIGSEGV CONFIRMED *** exit 139"
            echo "CWE-476: JSC::ProxyObject::getHandlerTrap stale IC dereference"
          elif [ $EXIT -eq 0 ]; then
            echo "Survived — JSC patched"
          else
            echo "Exit: $EXIT"
          fi

      - name: Summary
        if: always()
        run: |
          echo "uname -m: $(uname -m)"
          sw_vers
          echo "JSC: $JSC"
          file "$JSC" 2>/dev/null || true
          echo "Control A:$exit_a B:$exit_b C:$exit_c PoC_D:$exit_d"
          [ "$exit_d" = "139" ] && echo "RESULT: SIGSEGV_CONFIRMED" || echo "RESULT: $exit_d"
