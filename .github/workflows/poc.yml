name: JSC Proxy Handler IC Stale Pointer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  poc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JSC
        run: |
          JSC="/System/Library/Frameworks/JavaScriptCore.framework/Versions/A/Helpers/jsc"
          echo "JSC=$JSC" >> $GITHUB_ENV
          echo "$(uname -m) macOS $(sw_vers -productVersion)"

      - name: Baseline PoC D
        run: |
          set +e; "$JSC" pocs/poc_d.js 2>&1; EXIT=$?
          echo "exit_d=$EXIT" >> $GITHUB_ENV
          [ $EXIT -eq 139 ] && echo "BASELINE: SIGSEGV" || echo "BASELINE: exit $EXIT"

      - name: Variant probes
        run: |
          set +e; "$JSC" pocs/poc_variants.js 2>&1; EXIT=$?
          echo "exit_variants=$EXIT" >> $GITHUB_ENV
          [ $EXIT -eq 139 ] && echo "VARIANTS: SIGSEGV" || echo "VARIANTS: exit $EXIT"

      - name: UAF probe
        run: |
          set +e; "$JSC" pocs/poc_uaf_probe.js 2>&1; EXIT=$?
          echo "exit_uaf=$EXIT" >> $GITHUB_ENV
          [ $EXIT -eq 139 ] && echo "UAF: SIGSEGV" || echo "UAF: exit $EXIT"

      - name: Summary
        if: always()
        run: |
          echo "Baseline: $exit_d | Variants: $exit_variants | UAF: $exit_uaf"
          if [ "$exit_variants" = "139" ] || [ "$exit_uaf" = "139" ]; then
            echo "RESULT: ADDITIONAL CRASH PATHS — investigate for control"
          else
            echo "RESULT: crash requires exact sequence — DoS only"
          fi
