name: JSC Proxy Handler IC Stale Pointer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  poc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find jsc binary
        run: |
          # macOS: jsc is inside Xcode
          JSC=$(find /Applications/Xcode*.app -name "jsc" -type f 2>/dev/null | head -1)
          # fallback: JavaScriptCore Helpers
          [ -z "$JSC" ] && JSC=$(find /System -name "jsc" -type f 2>/dev/null | head -1)
          echo "JSC=$JSC" >> $GITHUB_ENV
          echo "Found jsc: $JSC"
          sw_vers && uname -m
          ls /Applications/ | grep -i xcode || true

      - name: Control A (expect exit 0)
        run: |
          set +e
          "$JSC" pocs/control_a.js 2>&1 &
          PID=$!; sleep 8; kill $PID 2>/dev/null; wait $PID 2>/dev/null
          EXIT=$?
          echo "exit_a=$EXIT" >> $GITHUB_ENV
          echo "Control A exit: $EXIT"

      - name: Control B (expect exit 0)
        run: |
          set +e
          "$JSC" pocs/control_b.js 2>&1
          EXIT=$?
          echo "exit_b=$EXIT" >> $GITHUB_ENV
          echo "Control B exit: $EXIT"

      - name: Control C (expect exit 0)
        run: |
          set +e
          "$JSC" pocs/control_c.js 2>&1
          EXIT=$?
          echo "exit_c=$EXIT" >> $GITHUB_ENV
          echo "Control C exit: $EXIT"

      - name: PoC D - FULL TRIGGER (expect SIGSEGV exit 139)
        run: |
          echo "=== POC D: poly-proto + IC warm + setPrototypeOf(null) + re-access ==="
          set +e
          "$JSC" pocs/poc_d.js 2>&1
          EXIT=$?
          set -e
          echo "exit_d=$EXIT" >> $GITHUB_ENV
          if [ $EXIT -eq 139 ]; then
            echo "*** SIGSEGV CONFIRMED *** exit 139"
            echo "CWE-476: JSC::ProxyObject::getHandlerTrap stale IC dereference"
          elif [ $EXIT -eq 0 ]; then
            echo "Survived — JSC patched"
          else
            echo "Exit: $EXIT"
          fi

      - name: Summary
        if: always()
        run: |
          echo "JSC binary: $JSC"
          echo "Control A: $exit_a | B: $exit_b | C: $exit_c | PoC D: $exit_d"
          [ "$exit_d" = "139" ] && echo "RESULT: SIGSEGV_CONFIRMED" || echo "RESULT: PATCHED or exit $exit_d"
