name: JSC Proxy Handler IC Stale Pointer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  poc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find ALL jsc binaries and identify provenance
        run: |
          echo "=== PLATFORM ==="
          uname -m
          sw_vers
          echo ""
          echo "=== ALL JSC BINARIES ON SYSTEM ==="
          find / -name "jsc" -type f 2>/dev/null | while read f; do
            echo "--- $f ---"
            file "$f"
            codesign -dv "$f" 2>&1 | grep -E "Identifier|TeamIdentifier|Authority" || true
            otool -L "$f" | grep -i "JavaScriptCore" || true
            echo ""
          done
          echo ""
          echo "=== SELECTING NON-iOS JSC ==="
          # Prefer macOS JSC, not iOSSupport
          JSC_MACOS=$(find /System/Library/Frameworks/JavaScriptCore.framework \
                           -name "jsc" -type f 2>/dev/null | head -1)
          JSC_XCODE=$(find /Applications/Xcode*.app/Contents \
                           -name "jsc" -type f 2>/dev/null | grep -v iOSSupport | head -1)
          JSC_ANY=$(find / -name "jsc" -type f 2>/dev/null \
                        | grep -v iOSSupport | head -1)
          echo "macOS framework JSC: $JSC_MACOS"
          echo "Xcode JSC (non-iOS): $JSC_XCODE"
          echo "Any non-iOS JSC:     $JSC_ANY"
          # Pick best option
          JSC="${JSC_MACOS:-${JSC_XCODE:-$JSC_ANY}}"
          echo "SELECTED: $JSC"
          echo "JSC=$JSC" >> $GITHUB_ENV
          echo ""
          echo "=== SELECTED BINARY DETAILS ==="
          file "$JSC"
          codesign -dv "$JSC" 2>&1
          otool -L "$JSC"

      - name: Control A (expect exit 0)
        run: |
          set +e; "$JSC" pocs/control_a.js 2>&1; EXIT=$?
          echo "exit_a=$EXIT" >> $GITHUB_ENV
          echo "Control A exit: $EXIT"

      - name: Control B (expect exit 0)
        run: |
          set +e; "$JSC" pocs/control_b.js 2>&1; EXIT=$?
          echo "exit_b=$EXIT" >> $GITHUB_ENV
          echo "Control B exit: $EXIT"

      - name: Control C (expect exit 0)
        run: |
          set +e; "$JSC" pocs/control_c.js 2>&1; EXIT=$?
          echo "exit_c=$EXIT" >> $GITHUB_ENV
          echo "Control C exit: $EXIT"

      - name: PoC D - FULL TRIGGER (expect SIGSEGV exit 139)
        run: |
          echo "=== POC D: poly-proto + IC warm + setPrototypeOf(null) + re-access ==="
          echo "JSC binary: $JSC"
          set +e
          "$JSC" pocs/poc_d.js 2>&1
          EXIT=$?
          set -e
          echo "exit_d=$EXIT" >> $GITHUB_ENV
          if [ $EXIT -eq 139 ]; then
            echo "*** SIGSEGV CONFIRMED *** exit 139"
            echo "CWE-476: JSC::ProxyObject::getHandlerTrap stale IC dereference"
          elif [ $EXIT -eq 0 ]; then
            echo "Survived — JSC patched"
          else
            echo "Exit: $EXIT"
          fi

      - name: Summary
        if: always()
        run: |
          echo "=== FINAL SUMMARY ==="
          uname -m
          sw_vers
          echo "JSC: $JSC"
          file "$JSC" 2>/dev/null || true
          echo "Control A: $exit_a | B: $exit_b | C: $exit_c | PoC D: $exit_d"
          [ "$exit_d" = "139" ] && echo "RESULT: SIGSEGV_CONFIRMED" || echo "RESULT: PATCHED or exit $exit_d"
